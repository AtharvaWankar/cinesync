<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineSync — Waiting...</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body class="watch-body">
  <div class="bg-aurora">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>
  <div class="overlay">
    <div class="overlay-box">
      <div class="logo">🎬 CineSync</div>
      <h2>Waiting for host...</h2>
      <p>The host hasn't loaded a movie yet. You'll be redirected automatically.</p>
      <div class="spinner" style="margin: 20px auto;"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io({
      reconnection: true,
      reconnectionAttempts: 20,
      reconnectionDelay: 2000,
      transports: ["polling", "websocket"],
    });
    // As soon as the host loads a movie, reload this page — it will now render watch.html
    socket.on("movie_changed", () => window.location.reload());
  </script>
</body>
</html>
